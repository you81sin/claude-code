<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pon - CHRONOS VTuber</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: Arial;
            font-size: 14px;
            z-index: 10;
        }
        #fps {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 4px;
            font-family: 'Courier New';
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">pon - Loading...</div>
    <div id="fps">FPS: 0</div>

    <script>
        'use strict';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        const fpsDisplay = document.getElementById('fps');

        let image = null;
        let frameCount = 0;
        let lastTime = Date.now();

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        async function init() {
            try {
                info.textContent = 'pon - Loading illustration...';

                const img = new Image();
                img.crossOrigin = 'anonymous';

                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('Failed to load'));
                    img.src = 'data/pon_illustration.png?t=' + Date.now();
                });

                image = img;
                info.textContent = 'pon - Ready ✓';
                animate();

            } catch (e) {
                console.error(e);
                info.textContent = `Error: ${e.message}`;
            }
        }

        function draw(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!image || !image.complete) return;

            const scale = Math.min(
                canvas.width / image.width,
                canvas.height / image.height
            );

            const x = (canvas.width - image.width * scale) / 2;
            const y = (canvas.height - image.height * scale) / 2;

            ctx.save();

            // 呼吸（スケール）
            const breathAmount = Math.sin((now % 3000) / 3000 * Math.PI * 2) * 0.02;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(1 + breathAmount, 1 + breathAmount);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // 頭の微妙な傾き
            ctx.translate(canvas.width / 2, canvas.height / 2);
            const headTilt = Math.sin(now / 4000 * Math.PI * 2) * 0.03;
            ctx.rotate(headTilt);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // 画像描画
            ctx.drawImage(image, x, y, image.width * scale, image.height * scale);

            ctx.restore();
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = Date.now();
            frameCount++;

            if (now - lastTime >= 1000) {
                fpsDisplay.textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = now;
            }

            draw(now);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        init();

        // TTS リップシンク対応
        window.updateLipSync = (value) => {
            // リップシンク処理（後で実装）
        };
    </script>
</body>
</html>
